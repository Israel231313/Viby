
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VIBY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="paginaCadastro">

        <a href="index.html" class="voltarInicio">← Voltar ao início</a>

        <div class="conteudoCadastro">

            <img src="img/logo.png" alt="Logo Viby" class="logoCadastro">

            <h1>Bem-vindo de volta!</h1>
            <p>Entre na sua conta e encontre sua vibe.</p>

            <form class="formularioCadastro">

                <label for="emailLogin">E-mail</label>
                <input type="email" id="emailLogin" name="email"
                    placeholder="Digite seu e-mail" required>

                <label for="senhaLogin">Senha</label>
                <input type="password" id="senhaLogin" name="senha"
                    placeholder="Digite sua senha" required>

                <button type="submit" class="botaoCadastro">
                    Entrar
                </button>

            </form>

            <p class="textoLogin">
                Ainda não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </div>

    </main>

</body>
</html>
